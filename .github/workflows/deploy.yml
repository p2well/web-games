name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages so the first run can't fail when Pages
          # hasn't been turned on in repo settings yet.
          enablement: true

      - name: Build all games
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          for dir in */ ; do
            name="${dir%/}"
            if [ -f "$name/package.json" ]; then
              echo "::group::Building $name"
              (cd "$name" && npm ci && npm run build)
              mkdir -p "_site/$name"
              cp -r "$name/dist/." "_site/$name/"
              echo "::endgroup::"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
