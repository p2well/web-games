<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEB GAMES</title>
    <style>
        :root {
            --neon-green: #00ff00;
            --hot-pink: #ff0055;
            --yellow: #ffff00;
            --cyan: #00ccff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px;
        }

        /* Scanline overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 2px,
                rgba(0, 0, 0, 0.35) 2px,
                rgba(0, 0, 0, 0.35) 4px
            );
            z-index: 100;
        }

        h1 {
            color: var(--neon-green);
            font-size: clamp(2rem, 8vw, 4rem);
            margin: 0 0 8px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6), 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .subtitle {
            color: var(--cyan);
            font-size: 1.2rem;
            margin: 0 0 44px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 3px solid var(--neon-green);
            background: #050505;
            padding: 32px 26px;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--hot-pink);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .card .title {
            color: var(--yellow);
            font-size: 2rem;
            font-weight: bold;
            margin: 0 0 12px;
            text-shadow: 0 0 6px rgba(255, 255, 0, 0.5), 0 0 14px rgba(255, 255, 0, 0.25);
        }

        .card .desc {
            color: #d6d6d6;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 18px;
            letter-spacing: 1px;
        }

        .card .cta {
            color: var(--hot-pink);
            font-size: 1.1rem;
        }

        footer {
            margin-top: 56px;
            color: #8fb0c0;
            font-size: 0.95rem;
        }

        footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 6px rgba(0, 204, 255, 0.4);
        }
    </style>
</head>
<body>
    <h1>WEB GAMES</h1>
    <p class="subtitle">// INSERT COIN //</p>

    <div class="grid">
        <a class="card" href="./snake/">
            <p class="title">SNAKE</p>
            <p class="desc">Classic neon arcade snake. Eat, grow, don't crash.</p>
            <p class="cta">&gt; PLAY</p>
        </a>
    </div>

    <footer>
        BUILT WITH PHASER 4 &middot;
        <a href="https://github.com/p2well/web-games">SOURCE</a>
    </footer>
</body>
</html>
